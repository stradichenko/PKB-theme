baseURL      = "https://stradichenko.github.io/PKB-theme/"
#languageCode = "en-us"
title        = "PKB-theme Demo"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.image]
        useEmbedded = 'fallback'  # Hugo 0.148+
      [markup.goldmark.renderHooks.link]
        useEmbedded = 'fallback'  # Hugo 0.148+
    [markup.goldmark.renderer]
      unsafe = true  # This allows raw HTML in markdown files
    [markup.goldmark.extensions]
      footnote = true  # Obsidian-style [^label] footnotes
      [markup.goldmark.extensions.passthrough]
        # Required for $$...$$ math; the theme's render-passthrough.html hook
        # re-emits delimiters for KaTeX. NOTE: this must live in the SITE
        # config; theme-provided markup config is not merged for module imports.
        enable = true
        delimiters = { block = [['\[', '\]'], ['$$', '$$']], inline = [['\(', '\)']] }

[module]
  [[module.imports]]
    path = "github.com/stradichenko/PKB-theme"
    # version = "v1.0.0"  # optional pin once you have tags

    [[module.imports.mounts]]
      source = "static" # inside the theme repo
      target = "static" # inject it into my site's    

    [[module.imports.mounts]]
      source = "assets"
      target = "assets"

    [[module.imports.mounts]]
      source = "content"
      target = "content"

    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"

    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"

    # Mount portfolio images to the correct assets path
    [[module.mounts]]
      source = "static/images/portfolio"
      target = "assets/images/portfolio"