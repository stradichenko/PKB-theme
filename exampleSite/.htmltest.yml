# htmltest configuration — invoked from exampleSite as:
#   htmltest -c .htmltest.yml --log-level 3 --skip-external
DirectoryPath: public
IgnoreDirectoryMissing: false
# NOTE: the CI builds with --baseURL "http://localhost/" so absolute internal
# links resolve against public/. htmltest has no URLSubDir-style option; do not
# add one, unknown keys are silently ignored.

# Hugo generates hash-bearing asset URLs and mailto/tel links that htmltest
# would otherwise flag; keep checks to real internal 404s.
IgnoreURLs:
  - "mailto:"
  - "tel:"
IgnoreAltMissing: true
IgnoreEmptyHref: false
IgnoreInternalEmptyHash: true
