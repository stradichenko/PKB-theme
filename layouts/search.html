{{ define "main" }}
<article class="search-page main-content">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>
  <div class="post-content">
    {{ .Content }}
    {{ partial "search.html" . }}
    <noscript>
      <p>Search requires JavaScript. You can also browse the <a href="{{ "/posts/" | relURL }}">posts</a> or <a href="{{ "/docs/" | relURL }}">documentation</a> sections directly.</p>
    </noscript>
  </div>
</article>
{{ end }}
