{{ $url := .url }}
{{ $alt := .alt | default "QR code" }}
{{ $qrImage := images.QR $url (dict "size" 200 "level" "medium") }}

<div class="qr-code-wrapper">
  <img
    src="{{ $qrImage.RelPermalink }}"
    alt="{{ $alt }}"
    class="page-qr-code"
    loading="lazy"
    width="200"
    height="200"
  />
</div>
